name: Tag and publish

# First image for an OpenTTD version is tagged 15.3.
# Later changes under docker/ (OpenGFX, Ubuntu, s6 scripts, …) become 15.3-1, 15.3-2, …

on:
  push:
    paths:
      - "docker/**"
  workflow_dispatch:

concurrency:
  group: tag-and-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-26.04
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      version: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine image version
        id: version
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const dockerfile = fs.readFileSync('docker/dockerfile', 'utf8');
            const arg = (name) => {
              const match = dockerfile.match(new RegExp(`ARG ${name}="([^"]+)"`));
              if (!match) throw new Error(`Missing ARG ${name} in docker/dockerfile`);
              return match[1];
            };

            const openttd = arg('OPENTTD_VERSION').replace(/^v/, '');
            const opengfx = arg('OPENGFX_VERSION');
            const lsio = arg('LSIO_VERSION');

            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const names = new Set(tags.map((t) => t.name));

            let tag = openttd;
            if (names.has(openttd)) {
              const prefix = `${openttd}-`;
              let last = 0;
              for (const name of names) {
                if (!name.startsWith(prefix)) continue;
                const rev = Number(name.slice(prefix.length));
                if (Number.isInteger(rev) && rev > last) last = rev;
              }
              tag = `${openttd}-${last + 1}`;
            }

            core.setOutput('tag', tag);
            core.setOutput('openttd', openttd);
            core.setOutput('opengfx', opengfx);
            core.setOutput('lsio', lsio);

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenTTD ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Container image for [OpenTTD ${{ steps.version.outputs.openttd }}](https://github.com/OpenTTD/OpenTTD/releases/tag/${{ steps.version.outputs.openttd }}).

            | Component | Version |
            | --- | --- |
            | OpenTTD | ${{ steps.version.outputs.openttd }} |
            | OpenGFX | ${{ steps.version.outputs.opengfx }} |
            | linuxserver Ubuntu | ${{ steps.version.outputs.lsio }} |

  build:
    needs: tag
    uses: ./.github/workflows/docker-build-publish.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
