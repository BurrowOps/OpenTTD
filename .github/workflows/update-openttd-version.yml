# When OPENTTD_VERSION in docker/dockerfile is updated (e.g. by Renovate or a merged PR):
# - Create tag vX.Y from the new version and push to GitHub
# - Tag push triggers the Docker build workflow
#
# Use Renovate to get version bumps: your Dockerfile already has
#   # renovate: datasource=github-releases depName=OpenTTD/OpenTTD
# Enable the Renovate app on this repo so it opens PRs for new OpenTTD releases.
# Dependabot does not update ARG from GitHub releases, only base image tags.

name: Tag OpenTTD version

on:
  push:
    paths:
      - "docker/dockerfile"
  workflow_dispatch:

jobs:
  tag-version:
    runs-on: ubuntu-latest
    # Only run on default branch
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get OPENTTD_VERSION from Dockerfile
        id: version
        run: |
          version=$(grep -m1 'ARG OPENTTD_VERSION=' docker/dockerfile | sed -n 's/.*"\([^"]*\)".*/\1/p')
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "OPENTTD_VERSION in Dockerfile: $version"

      - name: Create and push tag if missing
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="$version"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, nothing to do"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
            echo "Created and pushed tag: $tag"
          fi
