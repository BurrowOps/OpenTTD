name: Build and Publish Docker Image

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Image version tag (OpenTTD version, or OpenTTD-revision like 15.3-1)
        required: false
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: burrowops/openttd
          flavor: |
            latest=true
          tags: |
            type=match,pattern=^v?(.+)$,group=1,value=${{ inputs.version || github.ref_name }},enable=${{ inputs.version != '' || startsWith(github.ref, 'refs/tags/') }}
            type=match,pattern=^v?(\d+\.\d+),group=1,value=${{ inputs.version || github.ref_name }},enable=${{ inputs.version != '' || startsWith(github.ref, 'refs/tags/') }}
            type=match,pattern=^v?(\d+),group=1,value=${{ inputs.version || github.ref_name }},enable=${{ inputs.version != '' || startsWith(github.ref, 'refs/tags/') }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
